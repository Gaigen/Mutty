port: 7880
rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: false
  # В Docker используем 0.0.0.0 для прослушивания всех интерфейсов
  node_ip: 0.0.0.0

# Keys from environment variables — set LIVEKIT_API_KEY and LIVEKIT_API_SECRET in .env
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

room:
  empty_timeout: 60

# Логирование
log_level: info
