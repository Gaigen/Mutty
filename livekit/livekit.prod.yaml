port: 7880
rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: false
  # В Docker используем 0.0.0.0 для прослушивания всех интерфейсов
  node_ip: 0.0.0.0

# For local dev — same keys must be in .env (LIVEKIT_API_KEY / LIVEKIT_API_SECRET)
# For production — generate new keys: https://docs.livekit.io/realtime/self-hosting/keys/
keys:
  devkey: this-is-a-secret-key-for-local-dev-only

room:
  empty_timeout: 60

# Логирование
log_level: info
