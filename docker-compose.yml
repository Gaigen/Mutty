services:
  # LiveKit сервер
  livekit:
    image: livekit/livekit-server:latest
    container_name: voice-app-livekit
    ports:
      - "7880:7880"  # WebSocket
      - "7881:7881"  # TCP RTC
      - "7882:7882/udp"  # UDP RTC
    volumes:
      - ./livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    networks:
      - voice-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Token server для выдачи токенов LiveKit
  # LIVEKIT_WS_URL — URL, который отдаётся БРАУЗЕРУ в ответе (должен быть localhost или твой домен)
  token-server:
    build:
      context: ./frontend
      dockerfile: Dockerfile.token-server
    container_name: voice-app-token-server
    ports:
      - "4000:4000"
    environment:
      - TOKEN_SERVER_PORT=4000
      - TOKEN_SERVER_HOST=0.0.0.0
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL:-ws://localhost:7880}
    depends_on:
      - livekit
    restart: unless-stopped
    networks:
      - voice-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/token"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend приложение
  # Важно: VITE_* — это URL для БРАУЗЕРА (твой ПК). Всегда localhost или твой домен, НЕ livekit!
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-ws://localhost:7880}
        VITE_TOKEN_ENDPOINT: ${VITE_TOKEN_ENDPOINT:-http://localhost:4000/api/token}
    container_name: voice-app-frontend
    ports:
      - "1420:80"
    depends_on:
      - token-server
      - livekit
    restart: unless-stopped
    networks:
      - voice-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  voice-app-network:
    driver: bridge
