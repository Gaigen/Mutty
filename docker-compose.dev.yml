# Docker Compose для разработки
# Использует volume mounts для hot reload

services:
  # LiveKit сервер
  livekit:
    image: livekit/livekit-server:latest
    container_name: voice-app-livekit-dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml --dev
    restart: unless-stopped
    networks:
      - voice-app-network

  # Token server для разработки (с hot reload через nodemon/tsx watch)
  token-server:
    build:
      context: ./frontend
      dockerfile: Dockerfile.token-server
    container_name: voice-app-token-server-dev
    ports:
      - "4000:4000"
    volumes:
      # Монтируем исходники для hot reload
      - ./frontend/scripts:/app/scripts:ro
    environment:
      - TOKEN_SERVER_PORT=4000
      - TOKEN_SERVER_HOST=0.0.0.0
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_WS_URL=ws://livekit:7880
    depends_on:
      - livekit
    restart: unless-stopped
    networks:
      - voice-app-network
    # Для dev можно использовать nodemon или tsx watch
    command: npx tsx watch scripts/dev-token-server.ts

  # Frontend для разработки (опционально, обычно запускается локально)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   ports:
  #     - "1420:1420"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   environment:
  #     - VITE_LIVEKIT_URL=ws://localhost:7880
  #     - VITE_TOKEN_ENDPOINT=http://localhost:4000/api/token
  #   command: npm run dev

networks:
  voice-app-network:
    driver: bridge
